name: service-status

x-aislamiento: &aislamiento
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 64
  tmpfs:
    - /tmp:rw,nosuid,noexec,size=16m
  logging:
    driver: json-file
    options:
      max-size: 5m
      max-file: '2'

services:
  api:
    <<: *aislamiento
    build:
      context: .
      dockerfile: operacion/Dockerfile.api
    restart: unless-stopped
    init: true
    mem_limit: 192m
    cpus: 0.5
    environment:
      STATUS_HOST: 0.0.0.0
      STATUS_SECRETOS: /run/secrets
      STATUS_ARCHIVO: /datos/estado.json
    volumes:
      - ${STATUS_LOCAL:-./local}/datos:/datos
    secrets:
      - source: canales
        target: canales.json
      - source: servidor_key
        target: servidor.key
      - source: servidor_crt
        target: servidor.crt
      - source: clientes_ca
        target: clientes-ca.crt
      - source: ca
        target: ca.crt
      - source: salud_key
        target: salud.key
      - source: salud_crt
        target: salud.crt
    healthcheck:
      test: [CMD, node, api/salud.ts]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [privada]

  tunel:
    <<: *aislamiento
    profiles: [cloudflare]
    image: cloudflare/cloudflared@sha256:1b1d34d0a9c0bfca9de72db8460d328db3f19edd2b96169114e3e893a97bbe53
    command: [--config, /etc/cloudflared/config.json, tunnel, --no-autoupdate, run]
    user: 1000:1000
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.5
    volumes:
      - ${STATUS_LOCAL:-./local}/cloudflared.json:/etc/cloudflared/config.json:ro
    secrets:
      - source: ca
        target: ca.crt
      - source: tunel
        target: tunel.json
    depends_on:
      api:
        condition: service_healthy
    networks: [privada, salida]

  agente:
    <<: *aislamiento
    profiles: [agente]
    build:
      context: .
      dockerfile: operacion/Dockerfile.agente
    mem_limit: 64m
    cpus: 0.25
    command: [-api, 'https://api:3444', -nombre-tls, status-api, -ca, /run/secrets/ca.crt, -clave, /run/secrets/web.key, -canal, web]
    secrets:
      - source: ca
        target: ca.crt
      - source: web_key
        target: web.key
    networks: [privada, salida]

  ia:
    <<: *aislamiento
    profiles: [ia]
    build:
      context: .
      dockerfile: operacion/Dockerfile.ia
    mem_limit: 128m
    cpus: 0.5
    command: [--api, 'https://api:3443', --secretos, /run/secrets, --ollama, 'http://ollama:11434', --modelo, 'qwen3.5:0.8b', --salida, /informes/ultimo.json]
    volumes:
      - ${STATUS_LOCAL:-./local}/informes:/informes
    secrets:
      - source: ca
        target: ca.crt
      - source: ia_key
        target: ia.key
      - source: ia_crt
        target: ia.crt
    depends_on:
      api:
        condition: service_healthy
    networks: [privada]

  ollama:
    profiles: [ia]
    image: ollama/ollama@sha256:4c5b27871a3239a717048f9b93057680a51b60c8119a7016aebb57f938e25e35
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 3g
    cpus: 2
    pids_limit: 128
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_CONTEXT_LENGTH: '4096'
    volumes:
      - modelos:/root/.ollama
    networks: [privada, salida]

networks:
  privada:
    internal: true
  salida:

volumes:
  modelos:

secrets:
  canales:
    file: ${STATUS_LOCAL:-./local}/secretos/canales.json
  servidor_key:
    file: ${STATUS_LOCAL:-./local}/secretos/servidor.key
  servidor_crt:
    file: ${STATUS_LOCAL:-./local}/secretos/servidor.crt
  clientes_ca:
    file: ${STATUS_LOCAL:-./local}/secretos/clientes-ca.crt
  ca:
    file: ${STATUS_LOCAL:-./local}/secretos/ca.crt
  salud_key:
    file: ${STATUS_LOCAL:-./local}/secretos/salud.key
  salud_crt:
    file: ${STATUS_LOCAL:-./local}/secretos/salud.crt
  ia_key:
    file: ${STATUS_LOCAL:-./local}/secretos/ia.key
  ia_crt:
    file: ${STATUS_LOCAL:-./local}/secretos/ia.crt
  web_key:
    file: ${STATUS_LOCAL:-./local}/secretos/web.key
  tunel:
    file: ${STATUS_LOCAL:-./local}/secretos/tunel.json
